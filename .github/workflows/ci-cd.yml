# CI/CD : tests backend a chaque push sur main.
# Backend : auto-deploy par l'integration Git de Render (des que le build passe).
# Frontend : auto-deploy par l'integration Git de Vercel.
name: ci-cd

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        run: pip install -r apps/api/requirements.txt

      - name: Run backend tests
        run: python -m pytest tests/ -q
