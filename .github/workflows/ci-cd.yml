# CI/CD : tests backend puis deploiement Fly.io automatique a chaque push sur main.
# Le frontend est deja auto-deploye par l'integration Git de Vercel.
#
# Secret requis (a ajouter dans GitHub > Settings > Secrets and variables > Actions) :
#   FLY_API_TOKEN = votre token (obtenu avec `flyctl auth token`)
name: ci-cd

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        run: pip install -r apps/api/requirements.txt

      - name: Run backend tests
        run: python -m pytest tests/ -q

  deploy-backend:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
