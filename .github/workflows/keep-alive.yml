# Keep-alive : garde le service Render reveille toutes les 5 minutes.
# Le plan free de Render endort le service apres 15 min sans trafic ;
# ce cron evite le cold start (30-60s) a la premiere requete.
name: keep-alive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health
        run: |
          curl -sf --max-time 120 --retry 3 --retry-delay 10 \
            https://agent-apprentissage-api.onrender.com/health \
            && echo "Backend awake" || echo "::warning::Backend did not respond"
