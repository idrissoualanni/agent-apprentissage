# Keep-alive : reveille la machine Fly.io toutes les 5 minutes.
# La machine est en auto_stop_machines="suspend" pour economiser ;
# ce cron evite le delai de demarrage (~5-9s) a la premiere requete.
name: keep-alive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health
        run: |
          curl -sf --max-time 60 --retry 3 --retry-delay 5 \
            https://agent-apprentissage-api.fly.dev/health \
            && echo "Backend awake" || echo "::warning::Backend did not respond"
