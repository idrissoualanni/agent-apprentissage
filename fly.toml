# ─── Fly.io — Backend FastAPI (Agent d'Apprentissage) ─────────────────────
# Option A : conserve SQLite + Chroma sur un volume persistant.
# Deploiement : fly launch --copy-config --no-deploy, puis fly deploy.

app = "agent-apprentissage-api"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile.api"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

# Volume persistant pour SQLite + Chroma + documents.
# Cree avec : fly volumes create agent_data --size 1 --region cdg
[mounts]
  source = "agent_data"
  destination = "/app/persist"

[env]
  DB_PATH = "/app/persist/db/agent.db"
  CHECKPOINT_DB = "/app/persist/checkpoints.db"
  CHROMA_DIR = "/app/persist/chroma"
  PDF_DIR = "/app/persist/documents"
